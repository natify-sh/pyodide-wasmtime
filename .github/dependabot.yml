version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"

  # the pinned Pyodide and Binaryen (package.json): a bump needs a new adapter.c check and a new release sha in tools/fetch.sh
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
