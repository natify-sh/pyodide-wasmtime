name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version for a build-only manual run"
        required: false
        type: string
        default: ""

run-name: >
  ${{ github.event_name == 'push' && 'Build & Release' || 'Build' }}

permissions:
  contents: read

jobs:
  build-wasm:
    uses: ./.github/workflows/build.yml

  build:
    name: Build wheel
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm needs tags

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - uses: actions/download-artifact@v8
        with:
          name: data
          path: src/pyodide_nojs/data

      # Wheel only: the wasm is built, not committed, so an sdist (git-tracked files) could not rebuild this wheel.
      - name: Build the wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
        run: uv build --wheel --out-dir dist

      - name: Smoke-test the wheel in a clean environment, both builds
        run: |
          uv venv -q /tmp/smoke
          uv pip install -q --python /tmp/smoke "$(ls dist/*.whl)[wasmtime]"
          cd /tmp
          for f in fused dynamic; do
            /tmp/smoke/bin/python -m pyodide_nojs --flavor $f -c "import sys; assert sum(range(10)) == 45; print('$f ok on', sys.platform)"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 14

  # PyPI publishing is off while the project is an alpha; to enable it again, uncomment this job
#   publish:
#     needs: build
#     if: github.event_name == 'push'
#     runs-on: ubuntu-latest
#     environment: pypi
#     permissions:
#       id-token: write
#     steps:
#       - uses: actions/download-artifact@v8
#         with:
#           name: dist
#           path: dist
#
#       - name: Publish to PyPI
#         uses: pypa/gh-action-pypi-publish@release/v1
#         with:
#           skip-existing: true

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: artifacts/dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "pyodide-nojs ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/dist/*
